[advisories]
yanked = "deny"

[licenses]
# The workspace crates are GPL-3.0-or-later and are never published; the allow
# list below applies to third-party dependencies only.
private = { ignore = true }
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
