[workspace]
members = [
    "crates/onyx-kvm-core",
    "crates/onyx-kvm-evidence",
    "crates/onyx-kvm-hid-broker",
    "crates/onyx-kvm-mcp",
    "crates/onyx-kvm-mdns",
    "crates/onyx-kvm-media-protocol",
    "crates/onyx-kvm-memtest",
    "crates/onyx-kvm-video-broker",
    "crates/onyx-kvm-audio-brokers",
    "crates/onyx-kvmd",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
